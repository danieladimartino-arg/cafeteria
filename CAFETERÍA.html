<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAFETERÍA</title>
<style>
:root{--bg:#FBF3E9;--card:#FFFFFF;--ink:#3B2A20;--accent:#C97B4A;--accent-dark:#A85D33;--soft:#F1E1CE;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#241C16;--card:#332821;--ink:#F3E9DD;--soft:#453529;}}
:root[data-theme="dark"]{--bg:#241C16;--card:#332821;--ink:#F3E9DD;--soft:#453529;}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
header{text-align:center;padding:18px 10px 6px;}
h1{margin:0;font-size:2.3rem;letter-spacing:2px;font-weight:800;}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);z-index:5;}
nav button{font-size:1.05rem;padding:12px 18px;border-radius:14px;border:2px solid var(--accent);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;}
nav button.active{background:var(--accent);color:#fff;}
main{max-width:900px;margin:0 auto;padding:6px 14px 40px;}
.name-box{width:100%;font-size:1.3rem;padding:14px;border-radius:14px;border:2px solid var(--soft);margin-bottom:14px;background:var(--card);color:var(--ink);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.prod{position:relative;background:var(--card);border-radius:16px;padding:8px;text-align:center;cursor:pointer;border:2px solid transparent;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s;}
.prod:active{transform:scale(.95);}
.prod.has{border-color:var(--accent);}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;background:#fff;}
.prod .ph{width:100%;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:var(--soft);}
.prod .nm{font-weight:700;font-size:.9rem;margin-top:6px;line-height:1.15;}
.prod .pr{font-size:.78rem;opacity:.65;}
.badge{position:absolute;top:2px;right:2px;background:var(--accent-dark);color:#fff;min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;padding:0 4px;}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 6px;margin-top:14px;display:flex;gap:10px;}
.btn{flex:1;padding:16px;border-radius:14px;border:none;font-size:1.1rem;font-weight:800;cursor:pointer;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--soft);}
.msg{text-align:center;padding:10px;border-radius:12px;margin-bottom:10px;font-weight:700;}
.msg.ok{background:#e4f4ea;color:#2f6b4a;}
.msg.err{background:#fbe7e4;color:#8a3527;}
.order-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;}
.order-card .who{font-size:1.15rem;font-weight:800;margin-bottom:6px;}
.order-card ul{margin:0;padding-left:20px;}
.order-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.small{font-size:.85rem;opacity:.65;}
.edit-row{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;flex-wrap:wrap;}
.edit-row img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#fff;}
.edit-row .ph{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--soft);}
.edit-row input[type=text]{flex:1;min-width:120px;padding:8px;border-radius:8px;border:1px solid var(--soft);font-size:1rem;background:var(--card);color:var(--ink);}
.edit-row input[type=number]{width:80px;padding:8px;border-radius:8px;border:1px solid var(--soft);font-size:1rem;background:var(--card);color:var(--ink);}
.iconbtn{background:var(--soft);border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:1rem;color:var(--ink);}
.iconbtn.del{background:#fbe7e4;color:#8a3527;}
.empty{text-align:center;opacity:.6;padding:30px 10px;}
.sync{text-align:center;font-size:.75rem;opacity:.5;margin-top:10px;}
</style>
</head>
<body>

</nav>

const SEED = [{"id": "cafe_solo", "name": "CAFÉ SOLO", "price": 2000, "img": "", "imgKey": "cafe"}, {"id": "cortado", "name": "CORTADO", "price": 2000, "img": "", "imgKey": "cafe"}, {"id": "cafe_leche", "name": "CAFÉ CON LECHE", "price": 2000, "img": "", "imgKey": "leche"}, {"id": "te", "name": "TÉ / MATE COCIDO", "price": 2000, "img": "", "imgKey": "te"}, {"id": "naranja", "name": "EXPRIMIDO DE NARANJA", "price": 0, "img": "", "imgKey": "naranja"}, {"id": "banana", "name": "LICUADO DE BANANA", "price": 0, "img": "", "imgKey": "banana"}, {"id": "limonada", "name": "LIMONADA", "price": 0, "img": "", "imgKey": "limonada"}, {"id": "medialuna", "name": "MEDIALUNA", "price": 1000, "img": "", "imgKey": "medialuna"}, {"id": "medialuna_jq", "name": "MEDIALUNA JAMÓN Y QUESO", "price": 1500, "img": "", "imgKey": "medialuna_jq"}, {"id": "tostado", "name": "TOSTADO JAMÓN Y QUESO", "price": 1500, "img": "", "imgKey": "tostado"}, {"id": "chipa", "name": "CHIPA", "price": 0, "img": "", "imgKey": "chipa"}, {"id": "alfajor", "name": "ALFAJOR DE MAICENA (x2)", "price": 750, "img": "", "imgKey": "alfajor"}, {"id": "budin", "name": "BUDÍN", "price": 0, "img": "", "imgKey": "budin"}];
let db=null, useDb=false;
let menu = load('cf_menu', SEED);
let orders = load('cf_orders', []);
let draft = {name:'', qty:{}};
let tab='pedido';

function load(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
function saveLocal(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function money(n){ n=Number(n)||0; return n>0? '$'+n.toLocaleString('es-AR') : ''; }
function esc(s){ return (s||'').replace(/"/g,'&quot;'); }

function render(){
 document.getElementById('tab-pedido').classList.toggle('active',tab==='pedido');
 document.getElementById('tab-resumen').classList.toggle('active',tab==='resumen');
 document.getElementById('tab-editar').classList.toggle('active',tab==='editar');
 const m=document.getElementById('main');
 if(tab==='pedido') m.innerHTML = viewPedido();
 else if(tab==='resumen') m.innerHTML = viewResumen();
 else m.innerHTML = viewEditar();
 wire();
}

function imgFor(p){ return p.img || DEFAULT_IMG[p.imgKey] || ''; }

function viewPedido(){
 let g = menu.map(p=>{
   const q=draft.qty[p.id]||0;
   const im = imgFor(p);
   const media = im? `<img src="${im}" alt="">` : `<div class="ph">🍽️</div>`;
   return `<div class="prod ${q>0?'has':''}" data-id="${p.id}">
      ${media}
      ${q>0?`<div class="badge">${q}</div>`:''}
      <div class="nm">${p.name}</div>
      ${p.price>0?`<div class="pr">${money(p.price)}</div>`:''}
    </div>`;
 }).join('');
 return `
  ${window._msg?`<div class="msg ${window._msg.t}">${window._msg.m}</div>`:''}
  <input id="cust" class="name-box" placeholder="Nombre del cliente" value="${esc(draft.name)}">
  <div class="grid">${g||'<div class="empty">No hay productos cargados todavía.<br>Agregalos en «Editar menú».</div>'}</div>
  <div class="bar">
    <button class="btn ghost" id="btnClear">↺ Empezar de nuevo</button>
    <button class="btn primary" id="btnSend">✅ Enviar pedido</button>
  </div>
  <div class="sync">${useDb?'🔄 Sincronizado entre dispositivos':'📴 Modo local (solo este dispositivo)'}</div>`;
}

function viewResumen(){
 const bar = `<div class="bar"><button class="btn ghost" id="btnWipe">🗑️ Vaciar todos los pedidos (fin del día)</button></div>`;
 if(!orders.length) return `<div class="empty">Todavía no hay pedidos tomados.</div>${bar}`;
 let cards = orders.slice().sort((a,b)=>a.ts-b.ts).map(o=>`
   <div class="order-card">
     <div class="top"><div class="who">${o.name}</div><button class="iconbtn" data-done="${o.id}">✓ Entregado</button></div>
     <ul>${o.items.map(i=>`<li>${i.name} × ${i.qty}</li>`).join('')}</ul>
   </div>`).join('');
 return `<div class="small" style="text-align:center;margin-bottom:10px;">${orders.length} pedido(s) en curso</div>${cards}${bar}`;
}

function viewEditar(){
 let rows = menu.map(p=>{
   const im = imgFor(p);
   const media = im? `<img src="${im}">` : `<div class="ph">🍽️</div>`;
   return `<div class="edit-row" data-id="${p.id}">
     ${media}
     <input type="text" value="${esc(p.name)}" data-f="name">
     <input type="number" value="${p.price||0}" data-f="price" min="0" step="50">
     <label class="iconbtn">📷<input type="file" accept="image/*" data-f="img" style="display:none;"></label>
     <button class="iconbtn del" data-f="del">🗑️</button>
   </div>`;
 }).join('');
 return `${rows || '<div class="empty">No hay productos. Agregá el primero.</div>'}
  <div class="bar"><button class="btn primary" id="btnAdd">➕ Agregar producto</button></div>
  <div class="sync">${useDb?'🔄 Los cambios se sincronizan en todos los dispositivos':'📴 Modo local (solo este dispositivo)'}</div>`;
}

function flash(t,m){ window._msg={t,m}; render(); setTimeout(()=>{window._msg=null; if(tab==='pedido')render();},1800); }

function wire(){
 document.getElementById('tab-pedido').onclick=()=>{tab='pedido';render();};
 document.getElementById('tab-resumen').onclick=()=>{tab='resumen';render();};
 document.getElementById('tab-editar').onclick=()=>{tab='editar';render();};

 if(tab==='pedido'){
   document.getElementById('cust').oninput=e=>{draft.name=e.target.value;};
   document.querySelectorAll('.prod').forEach(el=>{
     el.onclick=()=>{ draft.qty[el.dataset.id]=(draft.qty[el.dataset.id]||0)+1; render(); };
   });
   document.getElementById('btnClear').onclick=()=>{draft={name:'',qty:{}}; render();};
   document.getElementById('btnSend').onclick=()=>{
     const name=(draft.name||'').trim();
     const items=Object.entries(draft.qty).filter(([k,v])=>v>0).map(([id,qty])=>{const p=menu.find(x=>x.id===id); return {id,name:p?p.name:'?',qty};});
     if(!name){flash('err','Falta el nombre del cliente'); return;}
     if(!items.length){flash('err','Elegí al menos un producto'); return;}
     addOrder({id:uid(), name, items, ts:Date.now()});
     draft={name:'',qty:{}};
     flash('ok','¡Pedido enviado!');
   };
 }
 if(tab==='resumen'){
   document.querySelectorAll('[data-done]').forEach(b=>{ b.onclick=()=>removeOrder(b.dataset.done); });
   const w=document.getElementById('btnWipe'); if(w) w.onclick=()=>{ if(confirm('¿Vaciar todos los pedidos del día? Esta acción no se puede deshacer.')) wipeOrders(); };
 }
 if(tab==='editar'){
   document.querySelectorAll('.edit-row').forEach(row=>{
     const id=row.dataset.id;
     row.querySelector('[data-f=name]').onchange=e=>{ updateProduct(id,{name:e.target.value}); };
     row.querySelector('[data-f=price]').onchange=e=>{ updateProduct(id,{price:Number(e.target.value)||0}); };
     row.querySelector('[data-f=img]').onchange=e=>{ const f=e.target.files[0]; if(f) resizeToDataUrl(f,im=>updateProduct(id,{img:im})); };
     row.querySelector('[data-f=del]').onclick=()=>{ if(confirm('¿Eliminar este producto del menú?')) deleteProduct(id); };
   });
   document.getElementById('btnAdd').onclick=()=>{ addProduct(); };
 }
}

function resizeToDataUrl(file,cb){
 const img=new Image(); const r=new FileReader();
 r.onload=()=>{ img.onload=()=>{
   const s=220; const c=document.createElement('canvas'); c.width=s;c.height=s;
   const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,s,s);
   const sc=Math.max(s/img.width,s/img.height); const w=img.width*sc,h=img.height*sc;
   ctx.drawImage(img,(s-w)/2,(s-h)/2,w,h);
   cb(c.toDataURL('image/jpeg',0.7));
 }; img.src=r.result; };
 r.readAsDataURL(file);
}

function persistMenu(){ saveLocal('cf_menu',menu); if(useDb) db.doc('menu/config').set({products:menu}).catch(()=>{}); }
function updateProduct(id,patch){ const p=menu.find(x=>x.id===id); if(p) Object.assign(p,patch); persistMenu(); render(); }
function addProduct(){ menu.push({id:uid(), name:'NUEVO PRODUCTO', price:0, img:''}); persistMenu(); render(); }
function deleteProduct(id){ menu=menu.filter(x=>x.id!==id); persistMenu(); render(); }

function persistOrdersLocal(){ saveLocal('cf_orders',orders); }
function addOrder(o){ orders.push(o); persistOrdersLocal(); if(useDb) db.doc('orders/'+o.id).set(o).catch(()=>{}); render(); }
function removeOrder(id){ orders=orders.filter(o=>o.id!==id); persistOrdersLocal(); if(useDb) db.doc('orders/'+id).delete().catch(()=>{}); render(); }
function wipeOrders(){ const ids=orders.map(o=>o.id); orders=[]; persistOrdersLocal(); render(); if(useDb) ids.forEach(id=>db.doc('orders/'+id).delete().catch(()=>{})); }

render();

(async()=>{
 try{
   if(!(window.claude && window.claude.use)) return;
   db = await window.claude.use('db');
   if(!db) return;
   useDb = true;
   db.doc('menu/config').onSnapshot(doc=>{
     const data = doc && doc.data ? doc.data() : (doc||null);
     if(data && Array.isArray(data.products) && data.products.length){ menu=data.products; saveLocal('cf_menu',menu); render(); }
     else { db.doc('menu/config').set({products:menu}).catch(()=>{}); }
   });
   db.collection('orders').onSnapshot(snap=>{
     const list=[]; (snap.docs||snap||[]).forEach(d=>{ const v=d && d.data ? d.data() : d; if(v) list.push(v); });
     orders=list; saveLocal('cf_orders',orders); render();
   });
 }catch(e){ useDb=false; }
})();
</script>
</body>
</html>
